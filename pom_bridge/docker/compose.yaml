services:
  bridge-humble:
    image: ghcr.io/romea/alpo:humble
    build:
      context: ../
      dockerfile: docker/Dockerfile
      network: host
      ssh: [default]
    network_mode: host
    stop_signal: SIGINT
    volumes:
      - ..:/bridge_ws/src/bridge:ro,Z
    environment:
      - ROS_IP=192.168.100.2
      - ROS_MASTER_URI=http://192.168.100.1:11311
      # - ROS_IP=127.0.0.1
      # - ROS_MASTER_URI=http://127.0.0.1:11311
    command: >-
      ros2 run alpo_bridge alpo_bridge
        --ros-args
        -r __ns:=/alpo/base
        -p override_ros1_master:=false

  bridge-jazzy:
    image: ghcr.io/romea/alpo:jazzy
    build:
      context: ../
      dockerfile: docker/Dockerfile
      network: host
      ssh: [default]
      args:
        FROM_IMAGE: ros:jazzy
